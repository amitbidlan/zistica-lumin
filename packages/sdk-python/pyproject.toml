[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is `lumin-io` (the PyPI name `lumin` is held by an
# unrelated project). Brand-consistent with the `@lumin-io/*` npm scope.
# The import package and the CLI command both stay `lumin` —
# `pip install lumin-io` then `import lumin` / `lumin demo`.
name = "lumin-io"
version = "0.7.1"
description = "Lumin — local-first observability + firewall for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Zistica Inc." }]
dependencies = [
    "httpx>=0.24.0",
    # Added for the Policy Engine (Accountability Layer Part B):
    #   - simpleeval: safe expression evaluation for policy conditions.
    #     Required because we MUST NOT use Python eval() — see comment
    #     in lumin/policy.py for the full security rationale.
    #   - pyyaml: parse the user's lumin-policies.yaml. There's no
    #     YAML support in the stdlib.
    # Both are pure-Python, no transitive deps. Deviation from the
    # "minimal deps" rule is intentional and documented in the Policy
    # Engine session.
    "simpleeval>=0.9.13",
    "pyyaml>=6.0",
]

[project.scripts]
# `pip install lumin-io` puts a `lumin` command on PATH:
#   lumin up      start the container + open the dashboard
#   lumin demo    fire a real attack at the live firewall
#   lumin doctor  connectivity + detector check
lumin = "lumin.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
langchain = [
    "langchain-core>=0.3.0",
]
langgraph = [
    "langgraph>=0.2.0",
]
crewai = [
    "crewai>=0.80.0",
]
anthropic = [
    "anthropic>=0.30.0",
]
llama_index = [
    "llama-index-core>=0.10.0",
]
litellm = [
    "litellm>=1.40.0",
]
openai_agents = [
    "openai-agents>=0.0.1",
]
autogen = [
    "pyautogen>=0.4.0",
]
pydantic_ai = [
    "pydantic-ai>=0.0.13",
]
all = [
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "crewai>=0.80.0",
    "anthropic>=0.30.0",
    "llama-index-core>=0.10.0",
    "litellm>=1.40.0",
    "openai-agents>=0.0.1",
    "pyautogen>=0.4.0",
    "pydantic-ai>=0.0.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lumin*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
